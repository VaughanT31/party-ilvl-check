name: Bug report
description: Something in Party iLvl Check is wrong or broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more of this you fill in, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in the addon list at the character screen.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you?
      options:
        - Normal or Heroic dungeon
        - Mythic 0
        - Mythic+ (before the timer started)
        - Outside a dungeon
        - Test Mode
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - Item level or M+ score
        - Buffs, food or flask
        - Enchants and gems
        - Weapon oil
        - Minimum iLvl alert
        - Window or minimap button
        - Something else
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error (if any)
      description: Turn on errors with /console scriptErrors 1, or use BugSack, and paste the full text.
      render: text
